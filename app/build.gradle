plugins {
    id 'com.android.application'
}

android {
    namespace 'infiapp.bumbumapps.photorecoverynew'
    compileSdk 36

    defaultConfig {
        applicationId "com.bumbumapps.recoverfile"
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
        resValues true
    }

    // play = Google Play, hms = Huawei AppGallery (Huawei Ads / Petal, no Google Mobile Services).
    // Release uses the app's Petal slots (override with -PHMS_BANNER_ID=...); debug builds use Huawei's test slots.
    flavorDimensions = ['store']
    productFlavors {
        play {
            dimension 'store'
        }
        hms {
            dimension 'store'
            resValue 'string', 'hms_banner_id', (project.findProperty('HMS_BANNER_ID') ?: 'a0o3imh571').toString()
            resValue 'string', 'hms_interstitial_id', (project.findProperty('HMS_INTERSTITIAL_ID') ?: 'j36eor2c6k').toString()
            resValue 'string', 'hms_test_banner_id', 'testw6vs28auh3'
            resValue 'string', 'hms_test_interstitial_id', 'testb4znbuh3n2'
        }
    }

    buildTypes {
        debug {
            // Google sample IDs: debug builds never request live ads.
            manifestPlaceholders = [admobAppId: "ca-app-pub-3940256099942544~3347511713"]
            resValue "string", "admob_banner_ads", "ca-app-pub-3940256099942544/9214589741"
            resValue "string", "admob_interstitial_ads", "ca-app-pub-3940256099942544/1033173712"
            resValue "string", "admob_open_ads", "ca-app-pub-3940256099942544/9257395921"
        }
        release {
            // Not published yet and no AdMob app exists for this package: until the owner creates
            // one, release builds use the sample app ID and request no ads (empty unit IDs).
            manifestPlaceholders = [admobAppId: "ca-app-pub-3940256099942544~3347511713"]
            resValue "string", "admob_banner_ads", ""
            resValue "string", "admob_interstitial_ads", ""
            resValue "string", "admob_open_ads", ""
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    hmsImplementation 'com.huawei.hms:ads-lite:13.4.91.301'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    testImplementation 'junit:junit:4.13.2'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.airbnb.android:lottie:6.6.7'
    implementation 'commons-io:commons-io:2.8.0'
    implementation 'com.karumi:dexter:6.2.3'

    playImplementation 'com.google.android.gms:play-services-ads:25.5.0'
    playImplementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.9.4'
}
